<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产品介绍与预约</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f7;color:#1d1d1f}
.hero{background:#fff;padding:10vh 20px;text-align:center}
.hero h1{font-size:48px;margin-bottom:12px}
.hero p{font-size:20px;color:#444;max-width:700px;margin:0 auto}
.section{max-width:900px;margin:60px auto;padding:0 20px}
.card{background:#fff;border-radius:20px;padding:40px;margin-bottom:30px}
.card h2{margin-bottom:20px;font-size:28px}
.form-card{max-width:700px;margin:60px auto}
.form-group{margin-bottom:24px}
label{display:block;margin-bottom:8px;font-weight:500}
input,textarea,select{width:100%;padding:16px;border:1px solid #ddd;border-radius:14px;font-size:16px}
button{background:#0071e3;color:#fff;border:none;padding:16px 32px;border-radius:14px;font-size:17px;cursor:pointer;width:100%}
button:hover{background:#0077ed}
.success{display:none;background:#e8f5e9;padding:20px;border-radius:14px;text-align:center;margin-top:20px}
</style>
</head>

<body>
<section class="hero">
<h1>你的产品名称</h1>
<p>这里写一句像官网一样的简介，简洁高级，突出亮点。</p>
</section>

<div class="section">
<div class="card">
<h2>产品特点</h2>
<p>这里写介绍，可以放图片、文字，排版完全像官方网站。</p>
</div>
</div>

<div class="section form-card">
<div class="card">
<h2>预约填写</h2>
<form id="dataForm">
<div class="form-group">
<label>姓名</label>
<input name="姓名" type="text" required>
</div>
<div class="form-group">
<label>电话</label>
<input name="电话" type="text" required>
</div>
<div class="form-group">
<label>意向产品</label>
<select name="意向产品" required>
<option>基础版</option>
<option>专业版</option>
<option>旗舰版</option>
</select>
</div>
<div class="form-group">
<label>备注需求</label>
<textarea name="备注" rows="4"></textarea>
</div>
<button type="submit">提交</button>
<div class="success" id="success">提交成功！</div>
</form>
</div>
</div>

<script>
// 替换成你的腾讯表单提交地址
const formActionUrl = "https://docs.qq.com/form/d/XXXXXXXXXXXX";

const form = document.getElementById('dataForm');
form.action = formActionUrl;
form.method = "POST";
form.target = "_blank";

form.addEventListener('submit', () => {
setTimeout(() => {
document.getElementById('success').style.display = 'block';
}, 500);
});
</script>
</body>
</html>
